name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Explicit pipefail: GitHub's default `bash -e` lets `cmd | tail` hide cmd's failure (terms-analysis#90).
defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  test:
    runs-on: [self-hosted, legal-corpus-ingester]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false  # no step needs git credentials; keep the token out of .git/config

      - name: Set up Python
        run: python3 --version

      - name: Install
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -e '.[dev]' 2>&1 | tail -5

      - name: Lint
        run: |
          source .venv/bin/activate
          ruff check .

      - name: Type check
        run: |
          source .venv/bin/activate
          mypy src/

      # The jurisdiction sync test reads terms-analysis's schemas.py; under CI
      # it fails, never skips, when this checkout is missing (r5 F5). It sits
      # inside the workspace, so ruff and mypy exclude companion/.
      - name: Check out terms-analysis (companion for the jurisdiction sync test)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: jennifer-mckinney/terms-analysis
          path: companion/terms-analysis
          persist-credentials: false

      - name: Unit tests
        env:
          TERMS_ANALYSIS_ROOT: ${{ github.workspace }}/companion/terms-analysis
        run: |
          source .venv/bin/activate
          pytest tests/unit tests/snapshot tests/cli -v --cov=src/legal_corpus_ingester --cov-report=xml --cov-fail-under=0 2>&1 | tail -30

      - name: Integration tests
        run: |
          source .venv/bin/activate
          pytest tests/integration -v 2>&1 | tail -30

      - name: E2E tests
        run: |
          source .venv/bin/activate
          pytest tests/e2e -v 2>&1 | tail -20

      - name: Upload coverage
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1  # v4.6.1
        if: always()
        with:
          name: coverage-report-${{ github.run_id }}
          path: coverage.xml
