name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash -eo pipefail {0}
jobs:
  test:
    runs-on: [self-hosted, legal-corpus-ingester]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        run: python3 --version

      - name: Install
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -e '.[dev]' 2>&1 | tail -5

      - name: Lint
        run: |
          source .venv/bin/activate
          ruff check .

      - name: Type check
        run: |
          source .venv/bin/activate
          mypy src/

      # Cross-repo P9 hook parity (terms-analysis#175, Copilot C3): compare
      # against the sibling's branch of the same name when it exists, else main.
      - name: Resolve sibling ref for P9 hook parity
        id: p9_sibling
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          ref="$(bash scripts/ci/p9-sibling-parity.sh resolve-ref jennifer-mckinney/terms-analysis "${HEAD_REF}")"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: P9 hook parity with terms-analysis (must run, never skip)
        env:
          P9_SIBLING_REF: ${{ steps.p9_sibling.outputs.ref }}
        run: |
          source .venv/bin/activate
          bash scripts/ci/p9-sibling-parity.sh check tests/unit/test_p9_gate_copilot.py::test_pre_push_hook_matches_the_sibling_repos_published_hook

      - name: Unit tests
        env:
          P9_SIBLING_REF: ${{ steps.p9_sibling.outputs.ref }}
        run: |
          source .venv/bin/activate
          pytest tests/unit tests/snapshot tests/cli -v --cov=src/legal_corpus_ingester --cov-report=xml --cov-fail-under=0 2>&1 | tail -30

      - name: Integration tests
        run: |
          source .venv/bin/activate
          pytest tests/integration -v 2>&1 | tail -30

      - name: E2E tests
        run: |
          source .venv/bin/activate
          pytest tests/e2e -v 2>&1 | tail -20

      - name: Upload coverage
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1  # v4.6.1
        if: always()
        with:
          name: coverage-report-${{ github.run_id }}
          path: coverage.xml
