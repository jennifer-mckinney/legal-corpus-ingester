name: P9 Review

# P9 independent review as standard CI jobs (terms-analysis#191), ported to
# legal-corpus-ingester. It runs on ubuntu-latest, not the self-hosted runner.
# Two Claude reviewers run on every pull request to main. Each one comments
# inline on its findings and writes p9-verdict.json; a separate gate step,
# run from a copy in RUNNER_TEMP, fails the job unless the verdict is PASS
# with zero findings (.github/p9/check_verdict.py).
#
# The reviewer gets an explicit tool allowlist (terms-analysis#214): Read,
# Grep, Glob, writes to p9-verdict.json only, and the inline PR-comment MCP
# tool. No Bash, so it sees the change through a diff and a changed-file list
# prepared before it runs. Reads are fenced to the workspace and that
# directory, and /proc, /sys and runner credential paths are denied as defence in
# depth, so the process environment (ANTHROPIC_API_KEY, the job token) cannot
# be read back. Checkout keeps no credential (persist-credentials: false), but
# the action itself writes the job token into the origin URL in .git/config,
# so the workspace .git directory is denied too. --setting-sources user ignores
# any .claude/settings.json the PR adds. ANTHROPIC_API_KEY is only the action step's input, never job env.
# Branch protection is pending: after the first green run the owner makes both
# jobs (security-review, grumpy-review) required checks on main.
#
# Auth: the ANTHROPIC_API_KEY repo secret. Fork PRs receive no secrets, so the
# review step fails and the job fails closed.
# Only fixed, non-user-controlled values (repo name, PR number, SHAs) reach the
# prompt; no PR title, body or branch name is interpolated anywhere.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# Nothing by default; each job grants only what it uses.
permissions: {}

# A new push to the PR cancels the review of the superseded commit.
concurrency:
  group: p9-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security-review:
    name: security-review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # A verdict file committed in the PR must never count as the review, and
      # the gate runs from a copy taken before the reviewer can edit the tree.
      - name: Prepare verdict gate
        run: |
          rm -f p9-verdict.json
          cp .github/p9/check_verdict.py "$RUNNER_TEMP/check_verdict.py"

      # The reviewer has no shell, so what changed is written to files it can
      # read. The base branch comes through env, never inline in the script.
      # The review unit is the net diff; commits.txt is context only. HEAD is
      # GitHub's synthetic merge commit, so the commit list ends at the PR head.
      - name: Prepare PR diff
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/p9"
          git diff "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/p9/pr.diff"
          git diff --name-only "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/p9/changed-files.txt"
          git log --oneline "origin/$BASE_REF..$HEAD_SHA" > "$RUNNER_TEMP/p9/commits.txt"

      - name: Security review
        uses: anthropics/claude-code-action@2dca132ff0e0c4094ce6048b422c6915a071210b # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE SHA: ${{ github.event.pull_request.base.sha }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            The PR is checked out in the current working directory.
            First read ${{ runner.temp }}/p9/changed-files.txt and
            ${{ runner.temp }}/p9/pr.diff: they are what this PR changes.
            Review the net diff. ${{ runner.temp }}/p9/commits.txt lists
            the PR's commits for context only.
            Then read .github/p9/security-engineer.md and follow it exactly,
            including its verdict contract.
          # Write is scoped through an Edit rule: Claude Code consults Edit(path)
          # rules for every file-writing tool and ignores Write(path) rules
          # (code.claude.com/docs/en/permissions, "Read and Edit").
          # Read path patterns follow the same doc: "//path" is absolute,
          # "~/path" is home, "./path" is the working directory, and a single
          # "/path" is relative to the settings file, so it is never used here.
          # runner.temp is absolute, so "/${{ runner.temp }}" renders as "//...".
          settings: '{"permissions":{"blockReadsOutsideWorkingDirectories":true,"deny":["Read(//proc/**)","Read(//sys/**)","Read(~/.git-credentials)","Read(~/.config/gh/**)","Read(~/.claude/.credentials.json)","Read(/${{ runner.temp }}/_runner_file_commands/**)","Read(./.git/**)"]}}'
          claude_args: |
            --max-turns 40
            --setting-sources user
            --add-dir ${{ runner.temp }}/p9
            --allowedTools "Read,Grep,Glob,Edit(./p9-verdict.json),mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Bash,WebFetch,WebSearch"

      - name: Gate on the security verdict
        run: python3 "$RUNNER_TEMP/check_verdict.py" p9-verdict.json

  grumpy-review:
    name: grumpy-review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # Same preparation as security-review.
      - name: Prepare verdict gate
        run: |
          rm -f p9-verdict.json
          cp .github/p9/check_verdict.py "$RUNNER_TEMP/check_verdict.py"

      - name: Prepare PR diff
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/p9"
          git diff "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/p9/pr.diff"
          git diff --name-only "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/p9/changed-files.txt"
          git log --oneline "origin/$BASE_REF..$HEAD_SHA" > "$RUNNER_TEMP/p9/commits.txt"

      - name: Code-quality review
        uses: anthropics/claude-code-action@2dca132ff0e0c4094ce6048b422c6915a071210b # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE SHA: ${{ github.event.pull_request.base.sha }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            The PR is checked out in the current working directory.
            First read ${{ runner.temp }}/p9/changed-files.txt and
            ${{ runner.temp }}/p9/pr.diff: they are what this PR changes.
            Review the net diff. ${{ runner.temp }}/p9/commits.txt lists
            the PR's commits for context only.
            Then read .github/p9/grumpy-developer.md and follow it exactly,
            including its verdict contract.
          # Write is scoped through an Edit rule: Claude Code consults Edit(path)
          # rules for every file-writing tool and ignores Write(path) rules
          # (code.claude.com/docs/en/permissions, "Read and Edit").
          # Read path patterns follow the same doc: "//path" is absolute,
          # "~/path" is home, "./path" is the working directory, and a single
          # "/path" is relative to the settings file, so it is never used here.
          # runner.temp is absolute, so "/${{ runner.temp }}" renders as "//...".
          settings: '{"permissions":{"blockReadsOutsideWorkingDirectories":true,"deny":["Read(//proc/**)","Read(//sys/**)","Read(~/.git-credentials)","Read(~/.config/gh/**)","Read(~/.claude/.credentials.json)","Read(/${{ runner.temp }}/_runner_file_commands/**)","Read(./.git/**)"]}}'
          claude_args: |
            --max-turns 40
            --setting-sources user
            --add-dir ${{ runner.temp }}/p9
            --allowedTools "Read,Grep,Glob,Edit(./p9-verdict.json),mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Bash,WebFetch,WebSearch"

      - name: Gate on the code-quality verdict
        run: python3 "$RUNNER_TEMP/check_verdict.py" p9-verdict.json
