name: Weekly Corpus Refresh
on:
  schedule:
    - cron: '0 3 * * 0'   # Sunday 3 AM UTC
  workflow_dispatch:        # allow manual trigger from Actions UI or gh CLI

permissions:
  contents: read
  issues: write

concurrency:
  group: refresh
  cancel-in-progress: false  # never cancel a refresh mid-run; partial bundles are invalid

jobs:
  refresh:
    runs-on: [self-hosted, legal-corpus-ingester]
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_LABEL: corpus-refresh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      # Fail loudly up front when the runner lacks gh or the issue label is
      # missing, instead of failing only when an issue must be filed (#21).
      - name: Preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            echo "::error::gh CLI not found on the runner; install it and restart the runner service" >&2
            exit 1
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY}/labels/${ISSUE_LABEL}" --silent; then
            echo "::error::Issue label '${ISSUE_LABEL}' could not be read (missing, or the token lacks access); create it: gh label create ${ISSUE_LABEL}" >&2
            exit 1
          fi

      - name: Set up Python
        run: python3 --version

      - name: Install
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -e '.[dev]' 2>&1 | tail -5

      - name: Record pre-refresh bundle target
        id: pre_refresh
        run: |
          # Capture the current symlink target (or empty string if out/current does not exist)
          if [ -L out/current ]; then
            echo "target=$(readlink out/current | tr -d '\n\r')" >> "$GITHUB_OUTPUT"
          else
            echo "target=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run refresh
        run: |
          source .venv/bin/activate
          ingester refresh --all; rc=$?
          # Exit 2 = no sources configured (fresh install) — not a failure.
          # Exit 0 = success. Any other code is a real error; propagate it.
          if [ $rc -eq 2 ]; then
            echo "No sources configured; skipping refresh."
          elif [ $rc -ne 0 ]; then
            echo "ingester refresh failed with exit code $rc" >&2
            exit $rc
          fi

      - name: Detect bundle change
        id: detect_change
        run: |
          # Compare symlink target after refresh to the pre-refresh value
          if [ -L out/current ]; then
            new_target=$(readlink out/current | tr -d '\n\r')
          else
            new_target=""
          fi
          pre_target="${{ steps.pre_refresh.outputs.target }}"

          # Also check for any uncommitted changes in out/ or state/
          git_dirty=$(git status --porcelain out/ state/ 2>/dev/null | wc -l | tr -d ' ')

          # Validate bundle version format (YYYY.M.PATCH) to prevent injection into issue body.
          if [ -n "$new_target" ] && ! echo "$new_target" | grep -qE '^[0-9]{4}\.[0-9]+\.[0-9]+$'; then
            echo "Unexpected bundle version format: '$new_target'" >&2
            exit 1
          fi
          if [ "$new_target" != "$pre_target" ] || [ "$git_dirty" -gt "0" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "new_target=$new_target" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "new_target=$new_target" >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue on corpus change
        if: steps.detect_change.outputs.changed == 'true'
        env:
          BUNDLE_VER: ${{ steps.detect_change.outputs.new_target }}
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          open_count=$(gh issue list --label "$ISSUE_LABEL" --state open --json number --jq 'length') || {
            echo "Warning: gh issue list failed; creating issue unconditionally." >&2
            open_count=0
          }
          if [ "$open_count" -eq 0 ]; then
            gh issue create \
              --title "Weekly corpus refresh -- $(date -u +%Y-%m-%d)" \
              --body "Corpus refreshed to bundle \`${BUNDLE_VER}\`.

          Run \`ingester validate-round-trip out/current\` to verify consumer compatibility before updating the terms-analysis consumer.

          Triggered by: ${EVENT_NAME} (run \`${RUN_ID}\`)" \
              --label "$ISSUE_LABEL"
          else
            echo "Corpus refresh issue already open; skipping duplicate."
          fi

      - name: Upload health report
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1  # v4.6.1
        if: always()
        with:
          name: health-report-${{ github.run_id }}
          path: out/health/
