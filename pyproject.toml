[project]
name = "legal-corpus-ingester"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.6",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "trafilatura>=1.9",
  "pdfminer.six>=20240706",
  "lxml>=5.2",
  "numpy>=1.26,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "vcrpy>=6.0",
  "pytest-recording>=0.13",
  "syrupy>=4.6",
  "ruff>=0.15,<0.16",  # rule behaviour can change between minors; upgrade: jennifer-mckinney/terms-analysis#179
  "mypy>=1.10",
]

[project.scripts]
ingester = "legal_corpus_ingester.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src/legal_corpus_ingester --cov-report=term-missing"
pythonpath = ["src"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"
# CI checks terms-analysis out into companion/ for the jurisdiction sync test.
extend-exclude = ["companion"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
strict = true
exclude = ["^companion/"]

[[tool.mypy.overrides]]
module = ["yaml", "lxml", "lxml.*"]
ignore_missing_imports = true
